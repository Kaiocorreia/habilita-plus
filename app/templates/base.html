<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Habilita+{% endblock %}</title>

    <meta name="description" content="Democratizando o acesso à habilitação">
    <meta name="theme-color" content="#2563EB">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Habilita+">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <link rel="icon" href="{{ url_for('static', filename='icons/icone-192.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-shell">
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                <div class="flash-container">
                    {% for categoria, mensagem in mensagens %}
                        <p class="flash flash-{{ categoria }}">{{ mensagem }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("/service-worker.js").catch(function () {
                    // Navegadores sem HTTPS ou embutidos em apps podem recusar o registro.
                    // O site continua funcionando normalmente, apenas sem instalação.
                });
            });
        }
    </script>
</body>
</html>

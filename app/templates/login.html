{% extends "base.html" %}
{% block title %}Entrar · Habilita+{% endblock %}
{% block content %}
<div class="splash-logo" style="text-align:center; margin-bottom: 28px;">Habilita<span class="mais">+</span></div>

<div class="card">
    <div class="cabecalho-tela">
        <h1>Entrar</h1>
        <p class="texto-secundario">Acesse sua conta para continuar.</p>
    </div>

    <form method="POST">
        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
        </div>
        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>
        </div>
        <button type="submit" class="botao botao-primario">Entrar</button>
    </form>
</div>

<p class="rodape-acao">Ainda não tem conta? <a href="{{ url_for('auth.cadastro_tipo') }}">Cadastre-se</a></p>
{% endblock %}
